<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>greenfir 音乐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0e1420;--panel:#141c2e;--card:#1a2438;--border:rgba(255,255,255,.08);--tx:#e6edf5;--mut:#8b97a7;--ac:#22d3ee;--ac2:#818cf8}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);color:var(--tx);height:100vh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:rgba(20,28,46,.9);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.logo{font-weight:800;font-size:17px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.sbox{flex:1;position:relative}
.sbox input{width:100%;padding:8px 12px 8px 32px;border-radius:18px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--tx);font:inherit;font-size:14px}
.sbox input:focus{outline:none;border-color:var(--ac)}
.sbox::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px}
select{padding:7px 8px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--tx);font:inherit;font-size:12px;max-width:110px}
.main{flex:1;overflow-y:auto;padding:12px 16px 120px}
.hint{text-align:center;color:var(--mut);font-size:13px;padding:40px 20px;line-height:1.8}
.song{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer;transition:.15s}
.song:hover{background:rgba(255,255,255,.05)}
.song.playing{background:linear-gradient(90deg,rgba(34,211,238,.15),rgba(129,140,248,.12))}
.song .idx{width:26px;text-align:center;color:var(--mut);font-size:13px;flex-shrink:0}
.song .info{flex:1;min-width:0}
.song .t{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .s{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.song .src{font-size:10px;padding:2px 6px;border-radius:5px;background:rgba(34,211,238,.15);color:var(--ac);flex-shrink:0}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(20,28,46,.96);border-top:1px solid var(--border);backdrop-filter:blur(12px);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
.barinfo{display:flex;align-items:center;gap:10px}
.cover{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;animation:spin 12s linear infinite;animation-play-state:paused}
.cover.on{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}
.barname{flex:1;min-width:0}
.barname .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barname .s{font-size:11px;color:var(--mut)}
.ctl{display:flex;align-items:center;gap:8px;justify-content:center;font-size:20px}
.ctl button{background:none;border:none;color:var(--tx);cursor:pointer;font-size:19px;padding:2px 6px}
.ctl button:active{transform:scale(.9)}
.prog{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mut)}
.prog input[type=range]{flex:1;height:3px;accent-color:var(--ac);cursor:pointer}
.vol{width:70px;height:3px;accent-color:var(--ac2);cursor:pointer}
.msg{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:99;display:none}
</style>
</head>
<body>
<div class="top">
  <div class="logo">🎵 greenfir</div>
  <div class="sbox"><input id="kw" placeholder="搜歌名 / 歌手" onkeydown="if(event.key==='Enter')doSearch()"></div>
  <select id="source" onchange="onSrcChange()"></select>
  <select id="level"></select>
</div>
<div class="main" id="list">
  <div class="hint">🎧 输入歌名或歌手，回车搜索<br><span style="font-size:12px">音源来自你的 ceshi.json 配置</span></div>
</div>
<div class="bar">
  <div class="barinfo">
    <div class="cover" id="cover">🎵</div>
    <div class="barname"><div class="t" id="bt">未在播放</div><div class="s" id="bs">—</div></div>
    <input type="range" class="vol" id="vol" min="0" max="1" step="0.01" value="0.8" oninput="audio.volume=this.value">
  </div>
  <div class="prog"><span id="ct">0:00</span><input type="range" id="prog" min="0" max="100" value="0" oninput="seek()"><span id="dt">0:00</span></div>
  <div class="ctl">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()" id="pb">▶️</button>
    <button onclick="next()">⏭</button>
  </div>
</div>
<div class="msg" id="msg"></div>
<audio id="audio"></audio>
<script>
const API='/api/music';
const DEFAULT_LINES=[{id:'kw',name:'小窝源',levels:['lossless','exhigh','standard']},{id:'kg',name:'小狗源',levels:['lossless','exhigh','standard']},{id:'wy',name:'小云源',levels:['lossless','exhigh','standard']},{id:'tx',name:'小Q源',levels:['lossless','exhigh','standard']},{id:'bili',name:'哔哩哔哩',levels:['bili192']},{id:'mg',name:'小粉源',levels:['standard']}];
let LINES=DEFAULT_LINES, SONGS=[], cur=-1, audio=document.getElementById('audio');
const $=id=>document.getElementById(id);
function toast(t){const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',2200);}

// 加载音源配置（优先你的 ceshi.json）
async function loadCfg(){
  try{
    const r=await fetch(API+'?action=config').then(x=>x.json());
    if(r.ok&&r.lines&&r.lines.length){LINES=r.lines;toast('已加载 '+r.lines.length+' 个音源');}
  }catch(e){}
  $('source').innerHTML=LINES.map(l=>`<option value="${l.id}">${l.name}</option>`).join('');
  onSrcChange();
}
function onSrcChange(){
  const l=LINES.find(x=>x.id===$('source').value)||LINES[0];
  $('level').innerHTML=(l.levels||['standard']).map(v=>`<option value="${v}">${v}</option>`).join('');
}
async function doSearch(){
  const kw=$('kw').value.trim();if(!kw)return;
  const src=$('source').value;
  $('list').innerHTML='<div class="hint">搜索中...</div>';
  try{
    const j=await fetch(`${API}?action=search&keyword=${encodeURIComponent(kw)}&source=${src}&size=25`).then(x=>x.json());
    if(!j.ok){$('list').innerHTML=`<div class="hint">❌ ${j.msg||'搜索失败'}</div>`;return;}
    SONGS=j.list||[];
    if(!SONGS.length){$('list').innerHTML='<div class="hint">没有找到结果<br><span style="font-size:12px">换个音源试试</span></div>';return;}
    render();
  }catch(e){$('list').innerHTML='<div class="hint">❌ 请求异常</div>';}
}
function render(){
  $('list').innerHTML=SONGS.map((s,i)=>`<div class="song${i===cur?' playing':''}" onclick="play(${i})">
    <div class="idx">${i===cur?'🎵':i+1}</div>
    <div class="info"><div class="t">${esc(s.name)}</div><div class="s">${esc(s.artist||'未知')} · ${esc(s.album||'')}</div></div>
    <div class="src">${s.source}</div></div>`).join('');
}
function esc(s){return String(s||'').replace(/[<>"]/g,c=>({'<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function play(i){
  cur=i;const s=SONGS[i];render();
  $('bt').textContent=s.name;$('bs').textContent=s.artist||'';toast('获取播放链接...');
  const lv=$('level').value;
  const j=await fetch(`${API}?action=url&id=${encodeURIComponent(s.id)}&source=${s.source}&album_id=${encodeURIComponent(s.album_id||'')}`).then(x=>x.json());
  if(!j.ok){toast('❌ '+(j.msg||'无法播放'));return;}
  // 走代理播放（解决跨域/防盗链）
  audio.src=`${API}?action=proxy&url=${encodeURIComponent(j.url)}&source=${s.source}`;
  audio.play().then(()=>{$('pb').textContent='⏸';$('cover').classList.add('on');}).catch(()=>toast('播放失败，点一下播放键'));
}
function toggle(){if(audio.paused){if(audio.src)audio.play();else if(cur>=0)play(cur);else if(SONGS.length)play(0);}else audio.pause();}
audio.onplay=()=>{$('pb').textContent='⏸';$('cover').classList.add('on');};
audio.onpause=()=>{$('pb').textContent='▶️';$('cover').classList.remove('on');};
audio.ontimeupdate=()=>{if(!audio.duration)return;$('prog').value=(audio.currentTime/audio.duration*100)||0;$('ct').textContent=fmt(audio.currentTime);$('dt').textContent=fmt(audio.duration);};
audio.onended=()=>next();
function seek(){if(audio.duration)audio.currentTime=audio.duration*($('prog').value/100);}
function fmt(s){s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function prev(){if(cur>0)play(cur-1);}
function next(){if(cur<SONGS.length-1)play(cur+1);}
loadCfg();
</script>
</body>
</html>
