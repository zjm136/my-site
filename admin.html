<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>greenfir · 存储管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1120;--card:rgba(17,24,39,0.82);--border:rgba(51,65,85,0.55);--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#818cf8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:radial-gradient(1200px 600px at 85% -5%,rgba(129,140,248,.16),transparent),radial-gradient(1000px 500px at -5% 5%,rgba(56,189,248,.12),transparent),var(--bg);color:var(--text);min-height:100vh;padding:20px}
header{position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);background:rgba(11,17,32,.72);border:1px solid var(--border);border-radius:16px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
header h1{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
header button{font:inherit;font-size:13px;padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(30,41,59,.6);color:var(--text);cursor:pointer;transition:.2s}
header button:hover{background:rgba(56,189,248,.18);border-color:var(--accent)}
main{max-width:900px;margin:0 auto}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 10px 34px rgba(0,0,0,.28)}
.card h2{font-size:13px;margin-bottom:14px;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}
input{font:inherit;font-size:14px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(15,23,42,.7);color:var(--text);margin-bottom:10px;transition:.2s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
button.primary{font:inherit;font-size:14px;padding:10px 16px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1220;font-weight:700;cursor:pointer;transition:.2s}
button.primary:hover{filter:brightness(1.08)}
button.danger{background:transparent;color:#ef4444;border:1px solid #ef4444;font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;cursor:pointer}
button.small{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(30,41,59,.6);color:var(--text);cursor:pointer}
.muted{color:var(--muted);font-size:13px}
.msg{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px}
.msg.ok{background:rgba(5,46,22,.6);color:#4ade80}
.msg.err{background:rgba(69,10,10,.6);color:#f87171}
.repo{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.repo .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.repo .name{font-weight:700}
.repo .tag{font-size:11px;padding:2px 8px;border-radius:6px;background:rgba(56,189,248,.15);color:var(--accent)}
.bar{height:8px;background:rgba(51,65,85,.5);border-radius:4px;overflow:hidden;margin:8px 0}
.bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2)}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <h1>💾 存储盘管理</h1>
  <button onclick="logout()">退出</button>
</header>

<main>
  <div class="card">
    <h2>➕ 添加新盘（远程建仓）</h2>
    <input id="repo-name" placeholder="仓库名（英文，如 pan3）">
    <input id="repo-label" placeholder="显示名（如 第三个账户）">
    <button class="primary" onclick="createRepo()">创建私有仓</button>
    <div id="create-msg"></div>
  </div>

  <div class="card">
    <h2>📀 我的盘（单仓上限 1GB）</h2>
    <div id="repos">加载中...</div>
  </div>
</main>

<script>
const API='';
let token='';

async function init(){
  // 从 localStorage 拿 admin token（admin.html 和 index 共享登录态）
  token=localStorage.getItem('token');
  if(!token){location.href='/admin-login.html';return;}
  loadRepos();
}
function msg(el,t,ok){const e=document.getElementById(el);e.textContent=t;e.className='msg '+(ok?'ok':'err');}

async function createRepo(){
  const name=document.getElementById('repo-name').value.trim();
  const label=document.getElementById('repo-label').value.trim();
  if(!name) return msg('create-msg','请填仓库名',false);
  const r=await fetch(API+'/api/admin-create-repo',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({name,label})});
  const j=await r.json(); msg('create-msg',j.msg||(j.ok?'已创建':'失败'),j.ok);
  if(j.ok){document.getElementById('repo-name').value='';document.getElementById('repo-label').value='';loadRepos();}
}

async function loadRepos(){
  const el=document.getElementById('repos');el.innerHTML='加载中...';
  const r=await fetch(API+'/api/admin-repos',{headers:{authorization:'Bearer '+token}});
  const j=await r.json();
  if(!j.ok){el.innerHTML='<p class="muted">'+(j.msg||'加载失败')+'</p>';return;}
  if(!j.repos.length){el.innerHTML='<p class="muted">暂无盘，先创建一个</p>';return;}
  el.innerHTML=j.repos.map(rep=>{
    const used=rep.usedKB*1024, pct=Math.min(100,used/j.quotaBytes*100);
    return '<div class="repo"><div class="top"><span class="name">📀 '+rep.label+' <span class="tag">'+(rep.is_default?'默认':'')+'</span></span></div>'+
      '<div class="muted" style="font-size:12px">'+rep.name+' · 已用 '+(used/1024/1024).toFixed(1)+' MB / 1024 MB</div>'+
      '<div class="bar"><div style="width:'+pct+'%"></div></div>'+
      '<div style="display:flex;gap:8px;margin-top:8px">'+
      (!rep.is_default?'<button class="small" onclick="setDefault(\''+rep.name+'\')">设为默认</button>':'')+
      '<button class="danger" onclick="deleteRepo(\''+rep.name+'\')">删除此盘</button>'+
      '</div></div>';
  }).join('');
}

async function setDefault(name){
  const r=await fetch(API+'/api/set-default-repo',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({name})});
  const j=await r.json();msg('create-msg',j.msg,j.ok);if(j.ok)loadRepos();
}
async function deleteRepo(name){
  if(!confirm('确定删除仓库「'+name+'」？仓内所有文件将一并删除！'))return;
  const r=await fetch(API+'/api/admin-delete-repo',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+token},body:JSON.stringify({name})});
  const j=await r.json();msg('create-msg',j.msg,j.ok);if(j.ok)loadRepos();
}
function logout(){localStorage.removeItem('token');location.href='/admin-login.html';}

init();
</script>
</body>
</html>
