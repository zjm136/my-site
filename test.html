<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>连通性测试 · 两代核心</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,sans-serif;background:#0e1420;color:#e6edf5;padding:16px;font-size:14px;line-height:1.7}
h1{font-size:16px;margin-bottom:6px;color:#22d3ee}p{color:#8b97a7;margin-bottom:12px;font-size:12px}
.card{background:#1a2438;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{font-size:13px;color:#22d3ee;margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.row:last-child{border:none}.ok{color:#4ade80}.no{color:#f87171}.mut{color:#8b97a7;font-size:11px}
button{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(90deg,#22d3ee,#818cf8);color:#0b1220;font-weight:800;font-size:14px;cursor:pointer;margin-bottom:10px}
button:active{transform:scale(.98)}
.seg{display:flex;gap:8px;margin-bottom:14px}
.seg button{margin:0;background:var(--card,#1a2438);color:#e6edf5;border:1px solid rgba(255,255,255,.1)}
.seg button.on{background:linear-gradient(90deg,#22d3ee,#818cf8);color:#0b1220}
</style></head>
<body>
<h1>🔗 greenfir 连通性测试（两代核心）</h1>
<p>分别测试 <b>一代(签名)</b> 与 <b>二代(无签名)</b>：点对应按钮，看自建 Worker 是否返回直链。把结果截图发给部署者。</p>
<div class="seg">
  <button id="bv1" onclick="run('v1')">测试 一代·签名</button>
  <button id="bv2" onclick="run('v2')">测试 二代·无签名</button>
</div>
<div id="out"></div>
<script>
const WORKER='https://music-service.greenfir.dpdns.org';
const API='/api/music';
let cur='v1';
async function probe(name,url,expectUrl){
  const row={name,status:null,ok:false,note:'',time:0};const start=Date.now();
  try{
    const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),15000);
    const r=await fetch(url,{signal:ctrl.signal,headers:{'User-Agent':'Mozilla/5.0'}});clearTimeout(t);
    row.status=r.status;row.time=Date.now()-start;
    const text=await r.text();
    if(/<!doctype|<html/i.test(text)){row.note='返回HTML(服务异常/鉴权拦截)';}
    else{try{const j=JSON.parse(text);const u=expectUrl?expectUrl(j):(j.url||(j.data&&j.data.url)||(Array.isArray(j)&&j[0]&&(j[0].url||j[0].src)));
      if(u){row.ok=true;row.note=String(u).slice(0,70);}else row.note='JSON无url: '+text.slice(0,50);}catch(e){row.note='非JSON: '+text.slice(0,50);}}
  }catch(e){row.note=(e.name==='AbortError'?'超时15s ':'')+e.message;}
  return row;
}
async function run(core){
  cur=core;document.getElementById('bv1').classList.toggle('on',core==='v1');document.getElementById('bv2').classList.toggle('on',core==='v2');
  const out=$('out');out.innerHTML=`<div class="card">测试「${core==='v1'?'一代·签名':'二代·无签名'}」中，约 20 秒...</div>`;
  let html=`<div class="card"><h3>${core==='v1'?'① 一代 · HMAC 签名':'① 二代 · 仅 ?token='}</h3>`;
  const a=await probe('自建Worker·网易云直链',`${API}?action=url&source=wy&id=1813729125&level=standard&core=${core}`,j=>j.url);
  html+=rowHtml(a);
  const b=await probe('自检汇总(test)',`${API}?action=test&keyword=${encodeURIComponent('起风了')}&core=${core}`,()=>null);
  html+=rowHtml(b);
  if(b.ok){try{const j=JSON.parse(await(await fetch(`${API}?action=test&keyword=${encodeURIComponent('起风了')}&core=${core}`)).text());
    html+='<div style="margin-top:8px;font-size:12px">';
    (j.aggregators||[]).forEach(x=>html+=`<div class="row"><span>${x.name}</span><span class="${x.ok?'ok':'no'}">${x.ok?'✅':'❌'} ${esc(x.note||'')}</span></div>`);
    (j.sources||[]).forEach(x=>html+=`<div class="row"><span>${x.name} 搜/链</span><span class="${x.url?'ok':'no'}">${x.search?'✅':'❌'}/${x.url?'✅':'❌'} ${esc(x.note||'')}</span></div>`);
    html+='</div>';}catch(e){}}
  html+=`</div>`;
  if(core==='v1'){
    html+=`<div class="card"><h3>② 一代专属：签名校验 verify</h3>`;
    const v=await probe('verify 签名一致性',`${API}?action=verify`,j=>j.ok);
    html+=rowHtml(v);html+=`</div>`;
  }
  html+=`<div class="card"><h3>📋 结论</h3><div class="mut">哪一代的「自建Worker·网易云直链」返回 ✅，就在播放器顶部下拉框选它。两代都不行再看直连层与报错详情。</div></div>`;
  out.innerHTML=html;
}
function rowHtml(r){return `<div class="row"><span>${r.name}</span><span class="${r.ok?'ok':'no'}">${r.ok?'✅':'❌'} <small class="mut">${r.status||''} ${r.time?r.time+'ms':''}</small><br>${esc(r.note||'')}</span></div>`;}
function esc(s){return String(s).replace(/[<&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
function $(id){return document.getElementById(id);}
run('v1');
</script></body></html>
