<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>greenfir 控制台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1120;--card:rgba(17,24,39,0.82);--border:rgba(51,65,85,0.55);--text:#e2e8f0;--muted:#94a3b8;--accent:#38bdf8;--accent2:#818cf8}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:radial-gradient(1200px 600px at 85% -5%,rgba(129,140,248,.16),transparent),radial-gradient(1000px 500px at -5% 5%,rgba(56,189,248,.12),transparent),var(--bg);color:var(--text);min-height:100vh;padding:20px}
header{position:sticky;top:0;z-index:10;backdrop-filter:blur(10px);background:rgba(11,17,32,.72);border:1px solid var(--border);border-radius:16px;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}
header h1{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px}
header button{font:inherit;font-size:13px;padding:7px 14px;border-radius:10px;border:1px solid var(--border);background:rgba(30,41,59,.6);color:var(--text);cursor:pointer;transition:.2s}
header button:hover{background:rgba(56,189,248,.18);border-color:var(--accent)}
main{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:18px;padding:20px;box-shadow:0 10px 34px rgba(0,0,0,.28)}
.card h2{font-size:13px;margin-bottom:14px;color:var(--accent);letter-spacing:.6px;text-transform:uppercase}
input{font:inherit;font-size:14px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(15,23,42,.7);color:var(--text);margin-bottom:10px;transition:.2s}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
button.primary{font:inherit;font-size:14px;padding:10px 16px;border-radius:10px;border:none;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1220;font-weight:700;cursor:pointer;width:100%;transition:.2s}
button.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.tabs{display:flex;gap:6px;margin-bottom:16px;background:rgba(15,23,42,.6);padding:4px;border-radius:12px}
.tab-btn{flex:1;padding:8px;border-radius:9px;border:none;background:transparent;color:var(--muted);cursor:pointer;font:inherit;font-size:13px;transition:.2s}
.tab-btn.active{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1220;font-weight:700}
.msg{font-size:13px;margin-top:8px;padding:8px 10px;border-radius:8px}
.msg.ok{background:rgba(5,46,22,.6);color:#4ade80}
.msg.err{background:rgba(69,10,10,.6);color:#f87171}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tool-btn{font:inherit;font-size:12px;padding:10px 8px;border-radius:10px;border:1px solid var(--border);background:rgba(15,23,42,.5);color:#cbd5e1;cursor:pointer;text-align:left;transition:.15s}
.tool-btn:hover{background:rgba(56,189,248,.14);border-color:var(--accent)}
.nav-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav-btn{font:inherit;font-size:12px;padding:10px;border-radius:10px;border:1px solid var(--border);background:rgba(15,23,42,.5);color:#cbd5e1;cursor:pointer;text-decoration:none;text-align:center;display:block;transition:.15s}
.nav-btn:hover{background:rgba(56,189,248,.14);border-color:var(--accent)}
.todo-item{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:14px;border-bottom:1px solid rgba(51,65,85,.4)}
.todo-item:last-child{border:none}
.todo-item input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.todo-item.done span{text-decoration:line-through;color:#64748b}
#gate{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% 0%,rgba(129,140,248,.18),transparent),var(--bg);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
#gate .card{width:100%;max-width:400px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.hidden{display:none!important}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(51,65,85,.6);border-radius:4px}
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h1 style="text-align:center;font-size:26px;margin-bottom:4px;background:linear-gradient(90deg,#38bdf8,#818cf8);-webkit-background-clip:text;background-clip:text;color:transparent">🌲 greenfir</h1>
    <p style="text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px">个人控制台</p>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('login')">登录</button>
      <button class="tab-btn" onclick="switchTab('reg')">注册</button>
    </div>
    <div id="login-panel">
      <input id="login-user" placeholder="账号名">
      <input id="login-pass" type="password" placeholder="密码">
      <button class="primary" onclick="doLogin()">登录</button>
    </div>
    <div id="reg-panel" class="hidden">
      <input id="reg-user" placeholder="账号名（3-20位字母数字）">
      <input id="reg-pass" type="password" placeholder="密码（至少6位）">
      <button class="primary" onclick="doRegister()">注册</button>
    </div>
    <div id="gate-msg"></div>
  </div>
</div>

<header class="hidden" id="main-header">
  <h1>🌲 greenfir 控制台</h1>
  <button onclick="logout()">退出</button>
</header>

<main id="main" class="hidden">

  <div class="card">
    <h2>🧰 快捷工具</h2>
    <div class="tool-grid">
      <button class="tool-btn" onclick="toolWeather()">🌤️ 天气</button>
      <button class="tool-btn" onclick="toolQuote()">💬 每日一句</button>
      <button class="tool-btn" onclick="toolMC()">🧱 MC种子</button>
      <button class="tool-btn" onclick="toolPass()">🔑 密码生成</button>
      <button class="tool-btn" onclick="toolBase64()">📦 Base64</button>
      <button class="tool-btn" onclick="toolColor()">🎨 颜色拾取</button>
      <button class="tool-btn" onclick="toolCalc()">🧮 计算器</button>
      <button class="tool-btn" onclick="toolPomo()">⏱️ 番茄钟</button>
    </div>
    <div id="tool-output" style="margin-top:12px;font-size:13px;color:#cbd5e1;min-height:20px;padding:10px;background:rgba(15,23,42,.5);border-radius:10px"></div>
  </div>

  <div class="card">
    <h2>📋 待办</h2>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input id="todo-input" placeholder="新待办" style="margin-bottom:0">
      <button class="primary" style="width:auto;padding:10px 16px" onclick="addTodo()">添加</button>
    </div>
    <div id="todo-list"></div>
  </div>

  <div class="card">
    <h2>🔗 导航</h2>
    <p style="font-size:11px;color:var(--muted);margin-bottom:10px;text-transform:uppercase">常用</p>
    <div class="nav-grid">
      <a class="nav-btn" href="https://chat.openai.com" target="_blank">ChatGPT</a>
      <a class="nav-btn" href="https://claude.ai" target="_blank">Claude</a>
      <a class="nav-btn" href="https://github.com" target="_blank">GitHub</a>
      <a class="nav-btn" href="https://youtube.com" target="_blank">YouTube</a>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase">小游戏</p>
    <div class="nav-grid">
      <a class="nav-btn" href="https://eaglercraft.com" target="_blank">Eaglercraft</a>
      <a class="nav-btn" href="https://krunker.io" target="_blank">Krunker</a>
      <a class="nav-btn" href="https://agar.io" target="_blank">Agar.io</a>
      <a class="nav-btn" href="https://slither.io" target="_blank">Slither.io</a>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase">我的世界</p>
    <div class="nav-grid">
      <a class="nav-btn" href="https://www.mcmod.cn" target="_blank">MC百科</a>
      <a class="nav-btn" href="https://www.chunkbase.com" target="_blank">Chunk Base</a>
      <a class="nav-btn" href="https://www.minecraftskins.com" target="_blank">皮肤编辑器</a>
      <a class="nav-btn" href="https://mcseedmap.net" target="_blank">种子地图</a>
    </div>
  </div>

  <div class="card hidden">
    <h2>📁 我的文件</h2>
    <p style="font-size:12px;color:#64748b">暂未开放（存储后端调整中）</p>
  </div>

</main>

<script>
const API='';
let token=localStorage.getItem('token');
let username=localStorage.getItem('user');

function showMsg(el,text,ok){
  const e=document.getElementById(el);
  e.textContent=text;e.className='msg '+(ok?'ok':'err');
}
function switchTab(t){
  document.getElementById('login-panel').classList.toggle('hidden',t!=='login');
  document.getElementById('reg-panel').classList.toggle('hidden',t!=='reg');
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',(i===0&&t==='login')||(i===1&&t==='reg')));
}

async function doRegister(){
  const u=document.getElementById('reg-user').value.trim();
  const p=document.getElementById('reg-pass').value;
  const r=await fetch(API+'/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const j=await r.json();
  showMsg('gate-msg',j.msg,j.ok);
  if(j.ok){document.getElementById('reg-user').value='';document.getElementById('reg-pass').value='';switchTab('login');}
}

async function doLogin(){
  const u=document.getElementById('login-user').value.trim();
  const p=document.getElementById('login-pass').value;
  const r=await fetch(API+'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const j=await r.json();
  if(j.ok){
    token=j.token;username=j.username;
    localStorage.setItem('token',token);localStorage.setItem('user',username);
    enterMain();
  }else showMsg('gate-msg',j.msg,false);
}

function logout(){
  const u=username;
  token='';username='';
  localStorage.removeItem('token');localStorage.removeItem('user');
  localStorage.removeItem('todos_'+u);
  location.reload();
}

function enterMain(){
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('main-header').classList.remove('hidden');
  document.getElementById('main').classList.remove('hidden');
  loadTodos();
}

if(token&&username){
  fetch(API+'/api/whoami',{headers:{authorization:'Bearer '+token}}).then(r=>r.json()).then(j=>{
    if(j.ok) enterMain(); else {localStorage.clear();}
  }).catch(()=>localStorage.clear());
}

function loadTodos(){
  const list=document.getElementById('todo-list');
  const key='todos_'+username;
  const todos=JSON.parse(localStorage.getItem(key)||'[]');
  list.innerHTML=todos.length?todos.map((t,i)=>'<div class="todo-item '+(t.done?'done':'')+'"><input type="checkbox" '+(t.done?'checked':'')+' onchange="toggleTodo('+i+')"><span style="flex:1">'+t.text+'</span><button onclick="delTodo('+i+')" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:14px">✕</button></div>').join(''):'<p style="color:#64748b;font-size:13px">暂无待办</p>';
}
function addTodo(){
  const input=document.getElementById('todo-input');const text=input.value.trim();
  if(!text) return;
  const key='todos_'+username;
  const todos=JSON.parse(localStorage.getItem(key)||'[]');
  todos.push({text,done:false});localStorage.setItem(key,JSON.stringify(todos));
  input.value='';loadTodos();
}
function toggleTodo(i){
  const key='todos_'+username;
  const todos=JSON.parse(localStorage.getItem(key)||'[]');
  todos[i].done=!todos[i].done;localStorage.setItem(key,JSON.stringify(todos));loadTodos();
}
function delTodo(i){
  const key='todos_'+username;
  const todos=JSON.parse(localStorage.getItem(key)||'[]');
  todos.splice(i,1);localStorage.setItem(key,JSON.stringify(todos));loadTodos();
}

async function toolWeather(){
  const o=document.getElementById('tool-output');o.textContent='获取中...';
  try{
    const geo=await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent('Beijing')).then(r=>r.json());
    if(!geo.results)return o.textContent='定位失败';
    const w=await fetch('https://api.open-meteo.com/v1/forecast?latitude='+geo.results[0].latitude+'&longitude='+geo.results[0].longitude+'&current_weather=true').then(r=>r.json());
    o.textContent='🌤️ '+geo.results[0].name+' | '+w.current_weather.temperature+'°C | 风 '+w.current_weather.windspeed+'km/h';
  }catch(e){o.textContent='天气获取失败';}
}
function toolQuote(){const o=document.getElementById('tool-output');fetch('https://v1.hitokoto.cn/?encode=json').then(r=>r.json()).then(j=>o.textContent='💬 '+j.hitokoto).catch(()=>o.textContent='获取失败');}
function toolMC(){
  const seed=prompt('输入MC种子（数字或字符串）：');if(!seed)return;
  let h=0;for(let i=0;i<seed.length;i++){h=(h<<5)-h+seed.charCodeAt(i);h|=0;}
  document.getElementById('tool-output').textContent='🧱 种子哈希值: '+h;
}
function toolPass(){
  const len=parseInt(prompt('密码长度（默认16）：','16'))||16;
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
  let p='';for(let i=0;i<len;i++) p+=chars[Math.floor(Math.random()*chars.length)];
  document.getElementById('tool-output').innerHTML='🔑 <code style="background:rgba(30,41,59,.8);padding:3px 8px;border-radius:6px">'+p+'</code> <button onclick="navigator.clipboard.writeText(\''+p+'\')" style="font-size:12px;padding:3px 8px;border-radius:6px;border:1px solid var(--border);background:rgba(30,41,59,.6);color:var(--text);cursor:pointer;margin-left:6px">复制</button>';
}
function toolBase64(){const s=prompt('输入要编码的文本：');if(s===null)return;document.getElementById('tool-output').textContent='📦 '+btoa(unescape(encodeURIComponent(s)));}
function toolColor(){const c=document.createElement('input');c.type='color';c.value='#38bdf8';c.oninput=()=>document.getElementById('tool-output').textContent='🎨 '+c.value;c.click();}
function toolCalc(){
  const expr=prompt('输入算式（如 12*34+5）：');if(!expr)return;
  try{document.getElementById('tool-output').textContent='🧮 = '+Function('"use strict";return ('+expr+')')();}
  catch(e){document.getElementById('tool-output').textContent='计算错误';}
}
let pomoTimer=null,pomoLeft=1500;
function toolPomo(){
  const o=document.getElementById('tool-output');
  if(pomoTimer){clearInterval(pomoTimer);pomoTimer=null;o.textContent='⏱️ 已停止';return;}
  pomoLeft=1500;o.textContent='⏱️ 25:00';
  pomoTimer=setInterval(()=>{pomoLeft--;if(pomoLeft<0){clearInterval(pomoTimer);pomoTimer=null;o.textContent='⏱️ 时间到！';return;}o.textContent='⏱️ '+String(Math.floor(pomoLeft/60)).padStart(2,'0')+':'+String(pomoLeft%60).padStart(2,'0');},1000);
}
</script>
</body>
</html>
